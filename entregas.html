  function renderCancelModal(){
    const cm = state.cancelModal;
    const backdrop = document.createElement('div');
    backdrop.className='modal-backdrop';
    backdrop.id='cancel-backdrop';

    const reasons = state.role==='business' ? CANCEL_REASONS_BUSINESS : CANCEL_REASONS_MOTOBOY;

    if(!cm.reason){
      // Step 1: pick a reason.
      backdrop.innerHTML = `
        <div class="modal-sheet">
          <div class="modal-head">
            <span class="modal-title">Por que deseja cancelar?</span>
            <button class="modal-close" id="cancel-close">✕</button>
          </div>
          <div class="reason-list">
            ${reasons.map(r => `<button class="reason-btn" data-pick-reason="${esc(r)}">${esc(r)}</button>`).join('')}
          </div>
        </div>
      `;
    } else {
      // Step 2: optional note (only really needed for "Outro motivo") + confirmation.
      const isOther = cm.reason === 'Outro motivo';
      backdrop.innerHTML = `
        <div class="modal-sheet">
          <div class="modal-head">
            <span class="modal-title">Confirmar cancelamento</span>
            <button class="modal-close" id="cancel-close">✕</button>
          </div>
          <p class="page-sub" style="margin-bottom:14px;">Motivo: <strong style="color:var(--text);">${esc(cm.reason)}</strong></p>
          ${isOther ? `
            <div class="field">
              <label>Descreva o motivo</label>
              <textarea id="cancel-note" placeholder="Conte rapidamente o que aconteceu">${esc(cm.note||'')}</textarea>
            </div>
          ` : ''}
          <p style="font-size:14px;margin-bottom:18px;">Tem certeza de que deseja cancelar esta corrida?</p>
          <div class="ticket-actions">
            <button class="btn-secondary" id="btn-cancel-back-reason">Voltar</button>
            <button class="btn-cancel-confirm" id="btn-confirm-cancel">Confirmar cancelamento</button>
          </div>
        </div>
      `;
    }
    return backdrop;
  }

  function renderTopupModal(){
    const backdrop = document.createElement('div');
    backdrop.className='modal-backdrop';
    backdrop.id='topup-backdrop';

    if(state.topupPix){
      // Step 2: QR code is showing, waiting for payment confirmation.
      const p = state.topupPix;
      backdrop.innerHTML = `
        <div class="modal-sheet">
          <div class="modal-head">
            <span class="modal-title">Pague com Pix</span>
            <button class="modal-close" id="topup-close">✕</button>
          </div>
          <p class="page-sub" style="margin-bottom:16px;">Escaneie o QR code no app do seu banco, ou copie o código abaixo. Assim que o pagamento cair, o saldo atualiza sozinho.</p>
          ${p.qrCodeBase64 ? `<img src="data:image/png;base64,${p.qrCodeBase64}" style="width:100%;max-width:260px;display:block;margin:0 auto 16px;border-radius:8px;background:#fff;padding:10px;">` : ''}
          ${p.qrCode ? `
            <div class="field">
              <label>Pix Copia e Cola</label>
              <textarea readonly style="font-family:var(--font-mono);font-size:11px;" rows="3">${esc(p.qrCode)}</textarea>
            </div>
            <button type="button" class="btn-secondary" id="btn-copy-pix" style="margin-bottom:14px;">📋 Copiar código Pix</button>
          ` : ''}
          <div class="topup-status" id="topup-status">⏳ Aguardando pagamento…</div>
        </div>
      `;
    } else {
      // Step 1: choose an amount and enter payer info Mercado Pago requires.
      backdrop.innerHTML = `
        <div class="modal-sheet">
          <div class="modal-head">
            <span class="modal-title">Adicionar créditos</span>
            <button class="modal-close" id="topup-close">✕</button>
          </div>
          <form id="form-topup" novalidate>
            <div class="field">
              <label>Valor a pagar via Pix (R$)</label>
              <input type="number" name="amount" step="0.01" min="1" placeholder="100.00">
              <div class="field-hint">💡 Cada R$ 1,00 vira 1 crédito = 1 entrega, não importa o valor que você definir pra pagar cada motoboy depois.</div>
            </div>
            <div class="field">
              <label>Seu e-mail (recibo do Pix)</label>
              <input type="text" name="email" placeholder="seu@email.com" value="${esc(state.profile.email||'')}">
            </div>
            <div class="field">
              <label>CPF (opcional, agiliza a aprovação)</label>
              <input type="text" name="cpf" placeholder="000.000.000-00">
            </div>
            <button type="button" id="btn-generate-pix" class="btn-primary">Gerar Pix</button>
          </form>
        </div>
      `;
    }
    return backdrop;
  }

  // ---------- event wiring ----------
  function attachHandlers(){
    const $ = sel => root.querySelector(sel);

    const btnChangeServer = $('#btn-change-server');
    if(btnChangeServer) btnChangeServer.onclick = ()=>setState({screen:'setup'});

    const btnSaveApiBase = $('#btn-save-api-base');
    if(btnSaveApiBase) btnSaveApiBase.onclick = ()=>{
      const form = $('#form-api-base');
      const val = new FormData(form).get('apiBase');
      btnSaveApiBase.disabled = true;
      btnSaveApiBase.textContent = 'Conectando…';
      saveApiBase(val).finally(()=>{
        if(btnSaveApiBase){ btnSaveApiBase.disabled = false; btnSaveApiBase.textContent = 'Salvar e continuar'; }
      });
    };

    // Simple screen navigation — any element with data-goto="screen-name".
    root.querySelectorAll('[data-goto]').forEach(elm=>{
      elm.onclick = ()=>setState({screen: elm.getAttribute('data-goto')});
    });

    root.querySelectorAll('[data-open-invoice]').forEach(elm=>{
      elm.onclick = ()=>openInvoice(elm.getAttribute('data-open-invoice'));
    });
    const printInvoiceBtn = $('#btn-print-invoice');
    if(printInvoiceBtn) printInvoiceBtn.onclick = ()=>window.print();

    const logoutBtn = $('#btn-logout');
    if(logoutBtn) logoutBtn.onclick = logout;

    // Generic auth-form submit wiring: reads every named field, requires
    // all of them non-empty (matching what the fields actually offer),
    // checks password confirmation when both fields are present, and
    // calls the given async submit function.
    function wireAuthForm(formId, btnId, submitFn, opts){
      const form = $('#'+formId);
      const btn = $('#'+btnId);
      if(!btn || !form) return;
      btn.onclick = ()=>{
        try{
          const fd = new FormData(form);
          const data = {};
          let missing = false;
          form.querySelectorAll('[name]').forEach(inputEl=>{
            const val = (fd.get(inputEl.name)||'').toString().trim();
            data[inputEl.name] = val;
            if(!val && inputEl.name !== 'confirmPassword') missing = true;
            if(inputEl.name === 'confirmPassword' && !val && 'password' in data) missing = true;
          });
          if(missing){ showToast('Preencha todos os campos'); return; }
          if(data.password !== undefined && data.confirmPassword !== undefined && data.password !== data.confirmPassword){
            showToast('As senhas não coincidem');
            return;
          }
          btn.disabled = true;
          const original = btn.textContent;
          btn.textContent = (opts && opts.loadingText) || 'Enviando…';
          Promise.resolve(submitFn(data)).finally(()=>{
            if(btn){ btn.disabled = false; btn.textContent = original; }
          });
        }catch(err){
          console.error('Falha no formulário '+formId, err);
          showToast('Deu um erro. Tenta de novo.');
        }
      };
    }

    wireAuthForm('form-login-business', 'btn-submit-login-business', submitBusinessLogin, {loadingText:'Entrando…'});
    wireAuthForm('form-register-business', 'btn-submit-register-business', submitBusinessRegister, {loadingText:'Criando conta…'});
    wireAuthForm('form-complete-business', 'btn-submit-complete-business', submitBusinessCompleteProfile, {loadingText:'Salvando…'});
    wireAuthForm('form-login-motoboy', 'btn-submit-login-motoboy', submitMotoboyLogin, {loadingText:'Entrando…'});
    wireAuthForm('form-register-motoboy', 'btn-submit-register-motoboy', submitMotoboyRegister, {loadingText:'Criando conta…'});
    wireAuthForm('form-complete-motoboy', 'btn-submit-complete-motoboy', submitMotoboyCompleteProfile, {loadingText:'Salvando…'});
    wireAuthForm('form-profile', 'btn-save-profile', saveProfile, {loadingText:'Salvando…'});
    wireAuthForm('form-change-password', 'btn-change-password', changePassword, {loadingText:'Trocando…'});

    const btnOpenProfile = $('#btn-open-profile');
    if(btnOpenProfile) btnOpenProfile.onclick = ()=>setState({screen:'profile'});

    const btnNewOrder = $('#btn-new-order');
    if(btnNewOrder) btnNewOrder.onclick = ()=>setState({modal:'new-order'});

    const modalClose = $('#modal-close');
    if(modalClose) modalClose.onclick = ()=>setState({modal:null});
    const backdrop = $('#modal-backdrop');
    if(backdrop) backdrop.onclick = (e)=>{ if(e.target===backdrop) setState({modal:null}); };

    const btnOpenTopup = $('#btn-open-topup');
    if(btnOpenTopup) btnOpenTopup.onclick = ()=>{ state.showTopup=true; state.topupPix=null; render(); };
    const btnOpenStatement = $('#btn-open-statement');
    if(btnOpenStatement) btnOpenStatement.onclick = openStatement;

    const btnOpenHistory = $('#btn-open-history');
    const btnOpenEarnings = $('#btn-open-earnings');
    const openHistoryFn = ()=>{
      state.historyDateFilter = 'todas';
      state.historyStatusFilter = 'todas';
      setState({screen: state.role==='business' ? 'history-business' : 'history-motoboy'});
    };
    if(btnOpenHistory) btnOpenHistory.onclick = openHistoryFn;
    if(btnOpenEarnings) btnOpenEarnings.onclick = openHistoryFn;
    root.querySelectorAll('[data-hfilter-date]').forEach(elm=>{
      elm.onclick = ()=>setState({historyDateFilter: elm.getAttribute('data-hfilter-date')});
    });
    root.querySelectorAll('[data-hfilter-status]').forEach(elm=>{
      elm.onclick = ()=>setState({historyStatusFilter: elm.getAttribute('data-hfilter-status')});
    });

    const topupClose = $('#topup-close');
    if(topupClose) topupClose.onclick = closeTopup;
    const topupBackdrop = $('#topup-backdrop');
    if(topupBackdrop) topupBackdrop.onclick = (e)=>{ if(e.target===topupBackdrop) closeTopup(); };

    const btnGeneratePix = $('#btn-generate-pix');
    if(btnGeneratePix) btnGeneratePix.onclick = ()=>{
      const form = $('#form-topup');
      const fd = new FormData(form);
      const amount = parseFloat(fd.get('amount'));
      const email = (fd.get('email')||'').toString().trim();
      const cpf = (fd.get('cpf')||'').toString().trim();
      if(!amount || amount <= 0){ showToast('Informe um valor válido'); return; }
      if(!email){ showToast('Informe seu e-mail'); return; }
      btnGeneratePix.disabled = true;
      btnGeneratePix.textContent = 'Gerando Pix…';
      generatePix(amount, email, cpf).finally(()=>{
        if(btnGeneratePix){ btnGeneratePix.disabled=false; btnGeneratePix.textContent='Gerar Pix'; }
      });
    };
    const btnCopyPix = $('#btn-copy-pix');
    if(btnCopyPix) btnCopyPix.onclick = ()=>{
      if(state.topupPix && state.topupPix.qrCode && navigator.clipboard){
        navigator.clipboard.writeText(state.topupPix.qrCode);
        showToast('Código Pix copiado');
      }
    };

    const formNewOrder = $('#form-new-order');
    const btnSubmitOrder = $('#btn-submit-order');
    if(btnSubmitOrder && formNewOrder) btnSubmitOrder.onclick = ()=>{
      try{
        const fd = new FormData(formNewOrder);
        const pickupAddress = (fd.get('pickupAddress')||'').toString().trim();
        const deliveryAddress = (fd.get('deliveryAddress')||'').toString().trim();
        const value = parseFloat(fd.get('value'));
        if(!pickupAddress || !deliveryAddress){
          showToast('Preencha os endereços de retirada e entrega');
          return;
        }
        if(!value || value <= 0){
          showToast('Informe um valor válido para a corrida');
          return;
        }
        btnSubmitOrder.disabled = true;
        btnSubmitOrder.textContent = 'Enviando…';
        createOrder({ pickupAddress, deliveryAddress, value, note: fd.get('note') });
      }catch(err){
        console.error('Falha ao criar corrida', err);
        showToast('Deu um erro ao solicitar. Tenta de novo.');
      }
    };

    root.querySelectorAll('[data-tab]').forEach(elm=>{
      elm.onclick = ()=>setState({motoboyTab: elm.getAttribute('data-tab')});
    });
    root.querySelectorAll('[data-btab]').forEach(elm=>{
      elm.onclick = ()=>setState({businessTab: elm.getAttribute('data-btab')});
    });

    root.querySelectorAll('[data-set-status]').forEach(elm=>{
      elm.onclick = ()=>setMotoboyStatus(elm.getAttribute('data-set-status'));
    });

    const btnOpenSoundPicker = $('#btn-open-sound-picker');
    if(btnOpenSoundPicker) btnOpenSoundPicker.onclick = ()=>{ ensureAudio(); setState({showSoundPicker:true}); };
    const soundClose = $('#sound-close');
    if(soundClose) soundClose.onclick = ()=>setState({showSoundPicker:false});
    const soundBackdrop = $('#sound-backdrop');
    if(soundBackdrop) soundBackdrop.onclick = (e)=>{ if(e.target===soundBackdrop) setState({showSoundPicker:false}); };
    root.querySelectorAll('[data-pick-preset]').forEach(elm=>{
      elm.onclick = ()=>saveSoundPreset(elm.getAttribute('data-pick-preset'));
    });
    const btnPickCustomSound = $('#btn-pick-custom-sound');
    const customSoundInput = $('#custom-sound-input');
    if(btnPickCustomSound && customSoundInput) btnPickCustomSound.onclick = ()=>customSoundInput.click();
    if(customSoundInput) customSoundInput.onchange = (e)=>{
      const file = e.target.files && e.target.files[0];
      if(file) saveCustomSound(file);
    };
    const btnPreviewSound = $('#btn-preview-sound');
    if(btnPreviewSound) btnPreviewSound.onclick = ()=>{ ensureAudio(); playAlertSound(); showToast('🔊 Tocando…'); };

    const alertView = $('#incoming-alert-view');
    if(alertView) alertView.onclick = ()=>setState({incomingAlert:null, motoboyTab:'disponiveis'});
    const alertDismiss = $('#incoming-alert-dismiss');
    if(alertDismiss) alertDismiss.onclick = ()=>setState({incomingAlert:null});

    root.querySelectorAll('[data-accept]').forEach(elm=>{
      elm.onclick = ()=>acceptOrder(elm.getAttribute('data-accept'));
    });
    root.querySelectorAll('[data-decline]').forEach(elm=>{
      elm.onclick = ()=>declineOrder(elm.getAttribute('data-decline'));
    });
    root.querySelectorAll('[data-give-up]').forEach(elm=>{
      elm.onclick = ()=>giveUpOrder(elm.getAttribute('data-give-up'));
    });
    root.querySelectorAll('[data-copy-address]').forEach(elm=>{
      elm.onclick = async ()=>{
        const address = elm.getAttribute('data-copy-address');
        let copied = false;
        if(navigator.clipboard && navigator.clipboard.writeText){
          try{ await navigator.clipboard.writeText(address); copied = true; }catch(e){ copied = false; }
        }
        if(!copied){
          // Fallback for browsers/contexts where the Clipboard API is
          // blocked (e.g. no HTTPS, older WebViews): select + execCommand.
          try{
            const ta = document.createElement('textarea');
            ta.value = address;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            copied = document.execCommand('copy');
            document.body.removeChild(ta);
          }catch(e){ copied = false; }
        }
        showToast(copied ? '📋 Endereço copiado — cole no seu app de GPS' : 'Não consegui copiar automaticamente — selecione o texto manualmente');
      };
    });
    root.querySelectorAll('[data-arrive-pickup]').forEach(elm=>{
      elm.onclick = ()=>{ elm.disabled = true; elm.textContent = 'Registrando…'; arriveAtPickup(elm.getAttribute('data-arrive-pickup')); };
    });
    root.querySelectorAll('[data-depart]').forEach(elm=>{
      elm.onclick = ()=>{ elm.disabled = true; elm.textContent = 'Saindo…'; departToDelivery(elm.getAttribute('data-depart')); };
    });
    root.querySelectorAll('[data-arrive-delivery]').forEach(elm=>{
      elm.onclick = ()=>{ elm.disabled = true; elm.textContent = 'Registrando…'; arriveAtDelivery(elm.getAttribute('data-arrive-delivery')); };
    });
    root.querySelectorAll('[data-deliver]').forEach(elm=>{
      elm.onclick = ()=>{ elm.disabled = true; elm.textContent = 'Confirmando…'; markDelivered(elm.getAttribute('data-deliver')); };
    });
    root.querySelectorAll('[data-open-cancel]').forEach(elm=>{
      elm.onclick = ()=>openCancelModal(elm.getAttribute('data-open-cancel'));
    });
    const cancelClose = $('#cancel-close');
    if(cancelClose) cancelClose.onclick = closeCancelModal;
    const cancelBackdrop = $('#cancel-backdrop');
    if(cancelBackdrop) cancelBackdrop.onclick = (e)=>{ if(e.target===cancelBackdrop) closeCancelModal(); };
    root.querySelectorAll('[data-pick-reason]').forEach(elm=>{
      elm.onclick = ()=>{ state.cancelModal.reason = elm.getAttribute('data-pick-reason'); render(); };
    });
    const cancelBackReason = $('#btn-cancel-back-reason');
    if(cancelBackReason) cancelBackReason.onclick = ()=>{ state.cancelModal.reason = null; render(); };
    const cancelNoteField = $('#cancel-note');
    if(cancelNoteField) cancelNoteField.oninput = (e)=>{ state.cancelModal.note = e.target.value; };
    const btnConfirmCancel = $('#btn-confirm-cancel');
    if(btnConfirmCancel) btnConfirmCancel.onclick = confirmCancel;

    root.querySelectorAll('[data-open-rate]').forEach(elm=>{
      elm.onclick = ()=>openRateModal(elm.getAttribute('data-open-rate'));
    });
    const rateClose = $('#rate-close');
    if(rateClose) rateClose.onclick = closeRateModal;
    const rateBackdrop = $('#rate-backdrop');
    if(rateBackdrop) rateBackdrop.onclick = (e)=>{ if(e.target===rateBackdrop) closeRateModal(); };
    root.querySelectorAll('[data-pick-star]').forEach(elm=>{
      elm.onclick = ()=>{ state.rateModal.stars = parseInt(elm.getAttribute('data-pick-star'),10); render(); };
    });
    const rateComment = $('#rate-comment');
    if(rateComment) rateComment.oninput = (e)=>{ state.rateModal.comment = e.target.value; };
    const btnSubmitRating = $('#btn-submit-rating');
    if(btnSubmitRating) btnSubmitRating.onclick = submitRating;
  }

  init();

  // Live pickup/delivery countdown — updates the timer text directly every
  // second without a full re-render, so it doesn't disturb typing or scrolling.
  setInterval(()=>{
    const el = root.querySelector('#countdown-timer');
    if(el){
      const startAt = parseInt(el.getAttribute('data-start-at'), 10);
      if(startAt){
        const remainingMs = (startAt + PICKUP_WINDOW_MS) - Date.now();
        const banner = root.querySelector('#active-ride-banner');
        if(remainingMs <= 0){
          el.textContent = 'ATRASADO';
          if(banner) banner.classList.add('is-late');
        } else {
          const totalSec = Math.floor(remainingMs/1000);
          const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
          const ss = String(totalSec%60).padStart(2,'0');
          el.textContent = mm+':'+ss;
          if(banner){
            banner.classList.toggle('is-warning', totalSec <= 180);
            banner.classList.remove('is-late');
          }
        }
      }
    }

    // Offer countdown(s) — how long each motoboy has before it passes to the next.
    root.querySelectorAll('.offer-countdown').forEach(oel=>{
      const offeredAt = parseInt(oel.getAttribute('data-offered-at'), 10);
      if(!offeredAt) return;
      const remaining = Math.max(0, Math.ceil((offeredAt + OFFER_TIMEOUT_MS - Date.now())/1000));
      oel.textContent = remaining + 's';
    });

    // Forced-pause countdown — shows the motoboy how long is left on the
    // automatic 10-minute pause applied after missing a pickup window.
    const pauseEl = root.querySelector('#forced-pause-countdown');
    if(pauseEl){
      const until = parseInt(pauseEl.getAttribute('data-until'), 10);
      const remainingMs = until - Date.now();
      if(remainingMs <= 0){
        pauseEl.textContent = 'agora mesmo — atualize a página se ainda aparecer pausado';
        if(state.profile) refreshOrders().then(render);
      } else {
        const totalSec = Math.ceil(remainingMs/1000);
        const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
        const ss = String(totalSec%60).padStart(2,'0');
        pauseEl.textContent = 'em ' + mm + ':' + ss;
      }
    }

    // GPS arrival lock — updates the live distance readout and enables the
    // "Cheguei" button only once the motoboy is within ARRIVAL_RADIUS_METERS.
    const gpsLock = root.querySelector('.gps-lock');
    if(gpsLock){
      const distEl = gpsLock.querySelector('#gps-distance');
      const btn = gpsLock.nextElementSibling; // the stage button right after the lock block
      const lat = parseFloat(gpsLock.getAttribute('data-lat'));
      const lng = parseFloat(gpsLock.getAttribute('data-lng'));

      if(geoState === 'denied'){
        distEl.innerHTML = '🚫 Você negou o acesso à localização. <span class="gps-retry" id="gps-retry">Tentar novamente</span>';
        gpsLock.onclick = (e)=>{ if(e.target.id==='gps-retry') retryGeoWatch(); };
        if(btn) btn.disabled = true;
      } else if(geoState === 'unsupported'){
        distEl.textContent = '⚠️ Não foi possível obter sua localização neste dispositivo.';
        if(btn) btn.disabled = true;
      } else if(!liveGeo){
        distEl.textContent = '📡 Obtendo sua localização…';
        if(btn) btn.disabled = true;
      } else {
        const dist = Math.round(haversineMeters(liveGeo.lat, liveGeo.lng, lat, lng));
        if(dist <= ARRIVAL_RADIUS_METERS){
          distEl.innerHTML = '✅ Você está perto (' + dist + 'm) — pode confirmar';
          gpsLock.classList.add('is-close');
          if(btn) btn.disabled = false;
        } else {
          distEl.innerHTML = '📍 Você está a <strong>' + dist + 'm</strong> — chegue a menos de ' + ARRIVAL_RADIUS_METERS + 'm para confirmar';
          gpsLock.classList.remove('is-close');
          if(btn) btn.disabled = true;
        }
      }
    }
  }, 1000);

  // Try to keep audio unlocked on every tap — some browsers re-suspend the
  // AudioContext, so a single one-time unlock isn't always enough.
  document.addEventListener('click', ensureAudio);
  document.addEventListener('touchstart', ensureAudio, {passive:true});

  // Mobile browsers throttle background tabs — catch up the moment the
  // app becomes visible/foreground again instead of waiting for the next tick.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && state.profile && !(state.modal || state.showTopup || state.cancelModal || state.showSoundPicker || state.rateModal)){
      refreshOrders().then(render);
    }
  });

  // Real "sem internet" detection — separate from "servidor fora do ar".
  window.addEventListener('offline', ()=>{
    state.isOffline = true;
    render();
  });
  window.addEventListener('online', async ()=>{
    state.isOffline = false;
    render();
    state.apiOk = await apiSelfTest();
    if(state.apiOk){
      showToast('🌐 Conexão restabelecida');
      if(state.profile) await refreshOrders();
    }
    render();
  });

  // While the server looks unreachable, keep quietly retrying in the
  // background instead of making the person reload the page themselves.
  setInterval(async ()=>{
    if(state.isOffline || state.apiOk !== false) return;
    const wasDown = true;
    state.apiOk = await apiSelfTest();
    if(wasDown && state.apiOk){
      showToast('✅ Conexão com o servidor restabelecida');
      if(state.profile) await refreshOrders();
      render();
    }
  }, 15000);

  // ---------- background location ping (online motoboys only) ----------
  // Separate from the arrival-lock GPS watch above: this one just lets the
  // server know roughly where each online motoboy is, so a new ride can be
  // offered to whoever's actually closest to the pickup address instead of
  // just whoever has done the fewest rides. A single fresh fix every ~25s
  // is plenty for that — no need for a continuous high-accuracy watch.
  function pingMotoboyLocationIfOnline(){
    if(state.role !== 'motoboy' || motoboyStatus() !== 'online') return;
    if(!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      pos => {
        apiPatch('/api/motoboys/'+state.myId, {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        }).catch(()=>{});
      },
      ()=>{ /* permission denied or unavailable — silently skip this round */ },
      {enableHighAccuracy:false, maximumAge:20000, timeout:10000}
    );
  }
  setInterval(pingMotoboyLocationIfOnline, 25000);
  pingMotoboyLocationIfOnline(); // also fire once right away after load/login
})();
</script>
</body>
