<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Despacho — Entregas por moto</title>

<!-- PWA: makes it installable with an icon and full-screen (no browser bar) -->
<meta name="theme-color" content="#101215">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Despacho">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="manifest" href="/manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101215;
    --surface:#1B1E23;
    --surface-2:#23272E;
    --border:#2B3038;
    --text:#F4F5F1;
    --muted:#8B929B;
    --lime:#C6FF3D;
    --orange:#FF6A3D;
    --amber:#FFC93D;
    --font-display:'Archivo Black', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  ::selection{background:var(--lime);color:#101215;}

  /* Top bar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 14px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:rgba(16,18,21,0.92);
    backdrop-filter:blur(6px);
    z-index:20;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand-mark{
    font-family:var(--font-display);
    font-size:17px;
    letter-spacing:0.5px;
  }
  .brand-tag{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--muted);
    letter-spacing:1.5px;
    text-transform:uppercase;
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .role-chip{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .btn-ghost{
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
  }
  .btn-ghost:hover{border-color:var(--muted);color:var(--text);}

  main{flex:1;padding:20px 20px 100px;}

  .sync-warning{
    background:#3A1600;
    border-bottom:1px solid var(--orange);
    color:#FFD0B8;
    font-family:var(--font-body);
    font-size:12px;
    line-height:1.5;
    padding:11px 20px;
  }

  /* Active ride — countdown to pickup */
  .active-ride{
    background:var(--surface);
    border:1px solid var(--orange);
    border-radius:10px;
    padding:16px;
    margin-bottom:20px;
  }
  .active-ride-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .active-ride-label{
    font-family:var(--font-display);
    font-size:13px;
    letter-spacing:0.3px;
  }
  .countdown-value{
    font-family:var(--font-mono);
    font-size:22px;
    font-weight:600;
    color:var(--orange);
  }
  .active-ride-sub{
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--muted);
    text-align:right;
    margin-top:-4px;
  }
  .active-ride-addr{
    font-size:14px;
    margin-top:10px;
    line-height:1.4;
  }
  .btn-copy-addr{
    flex-shrink:0;
    font-family:var(--font-mono);
    font-size:11px;
    background:transparent;
    border:1px solid var(--border, #444);
    color:inherit;
    border-radius:6px;
    padding:4px 8px;
    cursor:pointer;
  }
  .btn-copy-addr:active{ opacity:0.6; }
  .active-ride.is-warning{ border-color:#FF3D3D; animation:alert-pulse-red 1s ease-in-out infinite; }
  .active-ride.is-warning .countdown-value{ color:#FF3D3D; }
  .active-ride.is-late{ border-color:#FF3D3D; background:rgba(255,61,61,0.08); }
  .active-ride.is-late .countdown-value{ color:#FF3D3D; }
  .active-ride.is-parked{ border-color:var(--lime); }
  .active-ride-hint{
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
    line-height:1.4;
  }
  .btn-stage{
    width:100%;
    margin-top:14px;
    background:var(--lime);
    color:#0E1210;
    border:none;
    font-family:var(--font-display);
    font-size:13px;
    padding:13px;
    border-radius:8px;
    cursor:pointer;
  }
  .btn-stage:disabled{opacity:0.5;cursor:not-allowed;}
  .gps-lock{
    margin-top:12px;
    padding:10px 12px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
  }
  .gps-lock.is-close{border-color:var(--lime);}
  .gps-distance{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
  }
  .gps-lock.is-close .gps-distance{color:var(--lime);}
  .gps-retry{text-decoration:underline;cursor:pointer;color:var(--text);}
  .gps-note{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
    margin-top:12px;
    padding:8px 10px;
    background:var(--surface-2);
    border-radius:7px;
  }
  .offer-note{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--amber);
    padding:0 16px 10px;
    margin-top:-6px;
  }
  @keyframes alert-pulse-red{
    0%,100%{ box-shadow:0 0 0 rgba(255,61,61,0); }
    50%{ box-shadow:0 0 0 3px rgba(255,61,61,0.15); }
  }

  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--muted);
    margin:0 0 6px;
  }
  h1.page-title{
    font-family:var(--font-display);
    font-size:26px;
    line-height:1.15;
    margin:0 0 6px;
  }
  p.page-sub{
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
    margin:0 0 28px;
  }

  /* Welcome screen */
  .role-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:8px;
  }
  .role-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:22px 16px;
    text-align:left;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
    color:var(--text);
    font-family:var(--font-body);
  }
  .role-card:hover{border-color:var(--lime);}
  .role-card:active{transform:scale(0.98);}
  .role-emoji{font-size:28px;display:block;margin-bottom:14px;}
  .role-name{font-family:var(--font-display);font-size:15px;margin-bottom:4px;}
  .role-desc{font-size:12px;color:var(--muted);line-height:1.4;}

  /* Forms */
  .field{margin-bottom:16px;}
  .field-hint{
    font-size:11px;
    color:var(--muted);
    margin-top:7px;
    line-height:1.4;
  }
  label{
    display:block;
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--muted);
    margin-bottom:7px;
  }
  input[type=text], input[type=tel], input[type=number], input[type=password], input[type=email], textarea, select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-body);
    font-size:15px;
    padding:12px 13px;
    border-radius:7px;
    outline:none;
    transition:border-color .15s ease;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--lime);}
  textarea{resize:vertical;min-height:64px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}

  .btn-primary{
    width:100%;
    background:var(--lime);
    color:#0E1210;
    border:none;
    font-family:var(--font-display);
    font-size:14px;
    letter-spacing:0.3px;
    padding:15px 16px;
    border-radius:8px;
    cursor:pointer;
    margin-top:6px;
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:active{transform:scale(0.99);}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}

  .btn-secondary{
    width:100%;
    background:none;
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    padding:12px 16px;
    border-radius:8px;
    cursor:pointer;
  }
  .btn-secondary:hover{border-color:var(--muted);}

  .divider-text{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:26px 0 18px;
  }
  .divider-text::before, .divider-text::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--border);
  }
  .link-muted{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
    text-decoration:underline;
    cursor:pointer;
  }
  .link-muted:hover{color:var(--text);}

  .existing-list{display:flex;flex-direction:column;gap:8px;}
  .existing-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:7px;
    padding:11px 13px;
    cursor:pointer;
  }
  .existing-item:hover{border-color:var(--muted);}
  .existing-name{font-size:14px;font-weight:600;}
  .existing-sub{font-family:var(--font-mono);font-size:11px;color:var(--muted);}
  .empty-note{color:var(--muted);font-size:13px;font-family:var(--font-mono);}

  .tip-box{
    margin-top:22px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    padding:13px 14px;
    font-size:12.5px;
    line-height:1.5;
    color:var(--muted);
  }
  .tip-box strong{color:var(--text);}

  /* Dashboard header stat strip */
  .credit-card{
    background:var(--surface);
    border:1px solid var(--lime);
    border-radius:10px;
    padding:16px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .credit-card.is-empty{border-color:var(--orange);}
  .credit-label{
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--muted);
    width:100%;
  }
  .credit-value{
    font-family:var(--font-display);
    font-size:22px;
    color:var(--lime);
    flex:1;
  }
  .credit-card.is-empty .credit-value{color:var(--orange);}
  .btn-topup{
    background:var(--lime);
    color:#0E1210;
    border:none;
    font-family:var(--font-display);
    font-size:12px;
    padding:10px 14px;
    border-radius:7px;
    cursor:pointer;
    white-space:nowrap;
  }
  .quick-access-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }
  .quick-access-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-display);
    font-size:12px;
    padding:13px 10px;
    border-radius:9px;
    cursor:pointer;
  }
  .quick-access-btn:hover{border-color:var(--lime);}
  .qa-icon{font-size:15px;}
  .topup-status{
    text-align:center;
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--muted);
    padding:14px;
    background:var(--surface-2);
    border-radius:8px;
  }
  .txn-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 4px;
    border-bottom:1px solid var(--border);
  }
  .txn-icon{
    width:32px;height:32px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-size:16px;
    flex-shrink:0;
  }
  .txn-icon.is-credit{background:rgba(198,255,61,0.15);color:var(--lime);}
  .txn-icon.is-debit{background:rgba(255,106,61,0.15);color:var(--orange);}
  .txn-info{flex:1;min-width:0;}
  .txn-desc{font-size:14px;}
  .txn-date{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:2px;}
  .txn-amount{
    font-family:var(--font-mono);
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
  }
  .txn-amount.is-credit{color:var(--lime);}
  .txn-amount.is-debit{color:var(--orange);}

  .filter-row{
    display:flex;
    gap:6px;
    margin-bottom:12px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .filter-chip{
    flex:0 0 auto;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:11px;
    padding:8px 13px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
  }
  .filter-chip.active{border-color:var(--lime);color:var(--lime);}

  .hist-row{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .hist-row-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .hist-id{font-family:var(--font-mono);font-size:11px;color:var(--muted);}
  .hist-date{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-bottom:8px;}
  .hist-line{font-size:13px;margin-bottom:3px;line-height:1.4;}
  .hist-foot{margin-top:8px;text-align:right;}
  .hist-value{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--lime);}
  .stat-strip{
    display:flex;
    gap:10px;
    margin-bottom:24px;
  }
  .stat-box{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    padding:14px 14px;
  }
  .stat-num{font-family:var(--font-display);font-size:20px;}
  .stat-label{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;}

  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:26px 0 12px;
  }
  .section-title{
    font-family:var(--font-display);
    font-size:14px;
    letter-spacing:0.3px;
    text-transform:uppercase;
  }
  .tab-row{
    display:flex;
    gap:6px;
    margin-bottom:18px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .tab-btn{
    flex:1 0 auto;
    min-width:84px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.3px;
    padding:10px 8px;
    border-radius:7px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active{border-color:var(--lime);color:var(--lime);}

  /* Online/offline switch */
  .online-toggle{
    display:flex;
    align-items:center;
    gap:11px;
    padding:14px 15px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
    cursor:pointer;
    margin-bottom:20px;
    transition:border-color .15s ease, background .15s ease;
  }
  .status-toggle-row{
    display:flex;
    gap:6px;
    margin-bottom:16px;
  }
  .status-btn{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--muted);
    font-family:var(--font-display);
    font-size:11px;
    padding:12px 6px;
    border-radius:8px;
    cursor:pointer;
  }
  .status-btn.is-online.active{border-color:var(--lime); color:var(--lime); background:rgba(198,255,61,0.08);}
  .status-btn.is-pausado.active{border-color:var(--amber); color:var(--amber); background:rgba(255,201,61,0.08);}
  .status-btn.is-offline.active{border-color:var(--muted); color:var(--text); background:var(--surface-2);}
  .online-toggle.is-on{background:rgba(198,255,61,0.08); border-color:var(--lime);}
  .toggle-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--muted);
    flex-shrink:0;
  }
  .online-toggle.is-on .toggle-dot{background:var(--lime); box-shadow:0 0 8px var(--lime);}
  .toggle-label{
    font-family:var(--font-mono);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.4px;
    flex:1;
    color:var(--muted);
  }
  .online-toggle.is-on .toggle-label{color:var(--lime);}
  .toggle-switch-visual{
    width:38px;height:22px;border-radius:20px;
    background:var(--border);
    position:relative;
    flex-shrink:0;
    transition:background .15s ease;
  }
  .online-toggle.is-on .toggle-switch-visual{background:var(--lime);}
  .toggle-switch-visual::after{
    content:'';
    position:absolute;
    top:2px;left:2px;
    width:18px;height:18px;
    border-radius:50%;
    background:#0E1210;
    transition:transform .15s ease;
  }
  .online-toggle.is-on .toggle-switch-visual::after{transform:translateX(16px); background:#fff;}

  /* Ticket card - the signature element */
  .ticket{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    margin-bottom:16px;
    overflow:hidden;
    animation:ticket-in .25s ease;
  }
  @keyframes ticket-in{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .ticket-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:14px 16px 12px;
  }
  .ticket-id{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:0.5px;}
  .ticket-badge{
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    padding:4px 8px;
    border-radius:20px;
    font-weight:600;
    white-space:nowrap;
  }
  .badge-pendente{background:var(--amber);color:#1a1500;}
  .badge-aceito{background:var(--orange);color:#1a0800;}
  .badge-entregue{background:var(--lime);color:#0E1210;}
  .badge-cancelado{background:var(--border);color:var(--muted);}

  .ticket-body{padding:0 16px 14px;}
  .route{display:flex;gap:12px;}
  .route-line{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:4px;
  }
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .dot-origin{background:var(--lime);}
  .dot-dest{background:var(--orange);}
  .route-connector{
    width:2px;
    flex:1;
    min-height:22px;
    background:repeating-linear-gradient(to bottom, var(--border) 0 4px, transparent 4px 8px);
    margin:3px 0;
  }
  .route-points{flex:1;display:flex;flex-direction:column;gap:18px;}
  .route-point-label{font-family:var(--font-mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;}
  .route-point-addr{font-size:14px;line-height:1.35;}

  .ticket-divider{
    position:relative;
    height:0;
    border-top:2px dashed var(--border);
    margin:14px -16px 0;
  }
  .ticket-divider::before, .ticket-divider::after{
    content:'';
    position:absolute;
    top:-9px;
    width:18px;height:18px;
    background:var(--bg);
    border-radius:50%;
  }
  .ticket-divider::before{left:-9px;}
  .ticket-divider::after{right:-9px;}

  .ticket-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px 16px;
    gap:10px;
    flex-wrap:wrap;
  }
  .ticket-value{font-family:var(--font-mono);font-size:19px;font-weight:600;color:var(--lime);}
  .ticket-meta{font-family:var(--font-mono);font-size:11px;color:var(--muted);}
  .ticket-actions{display:flex;gap:8px;width:100%;margin-top:4px;}
  .ticket-actions button{flex:1;}
  .btn-accept{
    background:var(--lime);
    color:#0E1210;
    border:none;
    font-family:var(--font-display);
    font-size:12px;
    padding:11px;
    border-radius:7px;
    cursor:pointer;
  }
  .btn-deliver{
    background:var(--orange);
    color:#1a0800;
    border:none;
    font-family:var(--font-display);
    font-size:12px;
    padding:11px;
    border-radius:7px;
    cursor:pointer;
  }
  .btn-cancel{
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.4px;
    padding:11px;
    border-radius:7px;
    cursor:pointer;
  }
  .btn-cancel:hover{border-color:#FF6A6A;color:#FF6A6A;}
  .btn-cancel-confirm{
    background:#FF3D3D;
    color:#fff;
    border:none;
    font-family:var(--font-display);
    font-size:12px;
    padding:11px;
    border-radius:7px;
    cursor:pointer;
    flex:1;
  }
  .reason-list{display:flex;flex-direction:column;gap:8px;}
  .reason-btn{
    text-align:left;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    padding:14px 16px;
    border-radius:8px;
    cursor:pointer;
  }
  .reason-btn:hover{border-color:var(--lime);}
  .star-row{
    display:flex;
    justify-content:center;
    gap:10px;
    font-size:36px;
    margin-bottom:18px;
  }
  .star-pick{color:var(--border);cursor:pointer;transition:color .1s ease;}
  .star-pick.is-filled{color:var(--amber);}
  .rated-note{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
    text-align:center;
    padding:8px;
  }
  .rating-badge{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--amber);
    background:var(--surface);
    border:1px solid var(--border);
    padding:6px 12px;
    border-radius:20px;
  }
  .rating-badge.is-empty{color:var(--muted);}
  .rating-count{color:var(--muted);font-size:11px;}
  .call-link{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--lime);
    text-decoration:none;
    border:1px solid var(--border);
    padding:9px 12px;
    border-radius:7px;
  }

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
  }
  .empty-state-emoji{font-size:32px;display:block;margin-bottom:12px;}
  .empty-state-text{font-size:13px;line-height:1.5;}

  /* FAB */
  .fab{
    position:fixed;
    bottom:0;
    left:0;right:0;
    display:flex;
    justify-content:center;
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    z-index:30;
  }
  .fab-inner{width:100%;max-width:480px;}

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;
    background:rgba(8,9,10,0.7);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .modal-sheet{
    width:100%;
    max-width:520px;
    background:var(--bg);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:16px 16px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
    animation:sheet-in .2s ease;
  }
  @keyframes sheet-in{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
  }
  .modal-title{font-family:var(--font-display);font-size:16px;}
  .modal-close{
    background:none;border:none;color:var(--muted);
    font-size:20px;cursor:pointer;line-height:1;padding:4px;
  }

  .toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);
    background:var(--surface-2);
    border:1px solid var(--lime);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:12px;
    padding:11px 18px;
    border-radius:8px;
    z-index:60;
    animation:toast-in .2s ease;
  }
  @keyframes toast-in{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}

  /* Big incoming-order banner — visual fallback when sound is blocked */
  .incoming-alert{
    position:fixed;
    top:0;left:0;right:0;
    z-index:70;
    padding:14px 16px;
    background:var(--lime);
    animation:alert-pulse 1s ease-in-out infinite;
  }
  @keyframes alert-pulse{
    0%,100%{ background:var(--lime); }
    50%{ background:var(--orange); }
  }
  .incoming-alert-inner{
    max-width:480px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .incoming-alert-text{display:flex;flex-direction:column;gap:2px;}
  .incoming-alert-title{
    font-family:var(--font-display);
    font-size:14px;
    color:#0E1210;
    letter-spacing:0.3px;
  }
  .incoming-alert-sub{
    font-family:var(--font-mono);
    font-size:11px;
    color:#0E1210;
    opacity:0.75;
  }
  .incoming-alert-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .incoming-alert-actions .btn-accept{
    background:#0E1210;
    color:var(--lime);
    padding:9px 14px;
    font-size:11px;
  }
  .incoming-alert-dismiss{
    background:none;
    border:none;
    color:#0E1210;
    font-size:16px;
    cursor:pointer;
    padding:4px 6px;
    opacity:0.7;
  }

  @media (max-width:400px){
    .role-emoji{font-size:24px;}
  }
  @media print{
    .topbar, .no-print{ display:none !important; }
    body{ background:#fff; }
  }

<body>
<div id="app"></div>

<script>
(function(){

  // ---------- PWA setup (service worker) ----------
  // Icon and manifest are now real static files (/icon.svg, /manifest.json)
  // linked directly in <head>. The service worker is registered from a
  // real URL (/service-worker.js) — a Blob URL, as this used to do, is
  // rejected by Chrome and Firefox per spec and never actually installed.
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
      .catch((e) => console.error('Falha ao registrar o service worker', e));
  }

  // ---------- storage helpers ----------
  // Wraps a promise so it always settles within `ms`, even if the storage
  // bridge never responds — this is what previously made "Cadastrar" hang
  // forever with no feedback.
  function withTimeout(promise, ms){
    return new Promise((resolve)=>{
      let done = false;
      const timer = setTimeout(()=>{ if(!done){ done=true; resolve(undefined); } }, ms);
      Promise.resolve(promise).then(v=>{
        if(!done){ done=true; clearTimeout(timer); resolve(v); }
      }).catch(()=>{
        if(!done){ done=true; clearTimeout(timer); resolve(undefined); }
      });
    });
  }
  async function getJSON(key, shared){
    if(!window.storage) return null;
    try{
      const r = await withTimeout(window.storage.get(key, !!shared), 3500);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ console.error('storage.get falhou', key, e); return null; }
  }
  async function setJSON(key, value, shared){
    if(!window.storage) return false;
    try{
      const r = await withTimeout(window.storage.set(key, JSON.stringify(value), !!shared), 3500);
      return !!r;
    }catch(e){ console.error('storage.set falhou', key, e); return false; }
  }
  async function listKeys(prefix, shared){
    if(!window.storage) return [];
    try{
      const r = await withTimeout(window.storage.list(prefix, !!shared), 3500);
      return r ? r.keys : [];
    }catch(e){ console.error('storage.list falhou', prefix, e); return []; }
  }
  function newId(prefix){
    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function esc(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function formatMoney(v){
    const n = parseFloat(v)||0;
    return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function formatCredits(v){
    const n = Math.round((parseFloat(v)||0)*100)/100;
    const label = n===1 ? 'crédito' : 'créditos';
    return n.toLocaleString('pt-BR', {maximumFractionDigits:2}) + ' ' + label;
  }
  function timeAgo(ts){
    const diff = Math.floor((Date.now()-ts)/1000);
    if(diff<60) return 'agora';
    if(diff<3600) return Math.floor(diff/60)+' min atrás';
    if(diff<86400) return Math.floor(diff/3600)+' h atrás';
    return Math.floor(diff/86400)+' d atrás';
  }
  function formatDateTime(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('pt-BR') + ' · ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  }
  function startOfToday(){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
  function startOfWeek(){
    const d = new Date(); d.setHours(0,0,0,0);
    const day = d.getDay(); // 0=domingo
    const diffToMonday = day===0 ? 6 : day-1;
    d.setDate(d.getDate()-diffToMonday);
    return d.getTime();
  }
  function startOfMonth(){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(1); return d.getTime(); }
  function matchesDateFilter(ts, filter){
    if(filter==='todas') return true;
    const now = Date.now();
    if(filter==='hoje') return ts >= startOfToday();
    if(filter==='7dias') return ts >= now - 7*24*60*60*1000;
    if(filter==='30dias') return ts >= now - 30*24*60*60*1000;
    return true;
  }
  function matchesStatusFilter(status, filter){
    if(filter==='todas') return true;
    if(filter==='finalizadas') return status==='entregue';
    if(filter==='canceladas') return status==='cancelado';
    if(filter==='andamento') return status==='pendente' || ACTIVE_STATUSES.includes(status);
    return true;
  }

  // ---------- backend API helpers ----------
  // All shared data (businesses, motoboys, orders) now lives on your own
  // server instead of window.storage. window.storage is still used only for
  // the API server address and the session token — both purely local to
  // this device/browser.
  const DEFAULT_API_BASE = 'https://despacho-backend-production-1f3a.up.railway.app';

  function authHeaders(){
    return state.authToken ? {'Authorization': 'Bearer ' + state.authToken} : {};
  }
  // If the server says our token is no longer valid, drop the local
  // session so the person is sent back to login instead of stuck loading.
  async function handleAuthFailure(){
    await setJSON('auth-token', null, false);
    await setJSON('my-role', null, false);
    state.authToken = null;
    state.role = null;
    state.myId = null;
    state.profile = null;
    state.screen = 'welcome';
    showToast('Sua sessão expirou — entre novamente');
    render();
  }
  async function apiGet(path){
    if(!state.apiBase) return null;
    try{
      const res = await withTimeout(fetch(state.apiBase + path, {headers: authHeaders()}), 6000);
      if(!res) return null;
      if(res.status === 401){ handleAuthFailure(); return null; }
      if(!res.ok) return null;
      return await res.json();
    }catch(e){ console.error('API GET falhou', path, e); return null; }
  }
  async function apiPost(path, body){
    if(!state.apiBase) return {error:'Servidor não configurado'};
    try{
      const res = await withTimeout(fetch(state.apiBase + path, {
        method:'POST',
        headers: Object.assign({'Content-Type':'application/json'}, authHeaders()),
        body: JSON.stringify(body||{})
      }), 6000);
      if(!res) return {error:'O servidor demorou demais para responder'};
      const data = await res.json().catch(()=>null);
      if(res.status === 401){ handleAuthFailure(); return {error:(data&&data.error)||'Sessão expirada'}; }
      if(!res.ok) return {error: (data && data.error) || 'Erro no servidor'};
      return data || {};
    }catch(e){ console.error('API POST falhou', path, e); return {error:'Não consegui falar com o servidor'}; }
  }
  async function apiPatch(path, body){
    if(!state.apiBase) return {error:'Servidor não configurado'};
    try{
      const res = await withTimeout(fetch(state.apiBase + path, {
        method:'PATCH',
        headers: Object.assign({'Content-Type':'application/json'}, authHeaders()),
        body: JSON.stringify(body||{})
      }), 6000);
      if(!res) return {error:'O servidor demorou demais para responder'};
      const data = await res.json().catch(()=>null);
      if(res.status === 401){ handleAuthFailure(); return {error:(data&&data.error)||'Sessão expirada'}; }
      if(!res.ok) return {error: (data && data.error) || 'Erro no servidor'};
      return data || {};
    }catch(e){ console.error('API PATCH falhou', path, e); return {error:'Não consegui falar com o servidor'}; }
  }
  async function apiSelfTest(){
    if(!state.apiBase) return false;
    try{
      const res = await withTimeout(fetch(state.apiBase + '/'), 6000);
      return !!(res && res.ok);
    }catch(e){ return false; }
  }

  // ---------- sound & notification tracking ----------
  let audioCtx = null;
  let customSoundEl = null; // <audio> element for a motoboy's uploaded sound, if any
  function ensureAudio(){
    try{
      if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if(audioCtx.state === 'suspended') audioCtx.resume();
    }catch(e){ /* audio unavailable */ }
  }
  function beep(freq, delay, duration){
    if(!audioCtx) return;
    try{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const t0 = audioCtx.currentTime + delay;
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.28, t0+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0+duration+0.02);
    }catch(e){ /* ignore */ }
  }

  // A couple of synthesized fallback patterns, in case audio playback of
  // the real file ever fails — plus a "custom" option below that plays a
  // sound file the motoboy uploads themselves from their own phone.
  const SOUND_PRESETS = {
    padrao:  { label: 'Padrão (som do app)' },
    bipe:    { label: 'Bipe duplo',   notes: [[740,0,0.16],[990,0.18,0.18]] },
    sino:    { label: 'Sino',         notes: [[1046,0,0.22],[1318,0.1,0.22],[1568,0.2,0.3]] },
    alerta:  { label: 'Alerta',       notes: [[600,0,0.12],[600,0.16,0.12],[600,0.32,0.18]] },
    sirene:  { label: 'Sirene curta', notes: [[500,0,0.3],[900,0.3,0.3],[500,0.6,0.3]] }
  };
  function playPreset(key){
    const preset = SOUND_PRESETS[key] && SOUND_PRESETS[key].notes ? SOUND_PRESETS[key] : SOUND_PRESETS.bipe;
    ensureAudio();
    preset.notes.forEach(([freq,delay,dur])=>beep(freq,delay,dur));
  }
  function playDataUri(uri){
    try{
      if(!customSoundEl) customSoundEl = new Audio();
      if(customSoundEl.src !== uri) customSoundEl.src = uri;
      customSoundEl.currentTime = 0;
      customSoundEl.play().catch(()=>{ /* browser blocked it — the vibration still fires */ });
    }catch(e){ playPreset('bipe'); }
  }

  function getSoundPref(){
    return state.soundPref || {type:'preset', preset:'padrao'};
  }
  function playAlertSound(){
    const pref = getSoundPref();
    if(pref.type === 'custom' && pref.dataUri){
      playDataUri(pref.dataUri);
    } else if(pref.type === 'preset' && pref.preset === 'padrao'){
      playDataUri(DEFAULT_ALERT_SOUND_DATAURI);
    } else {
      playPreset(pref.preset || 'padrao');
    }
  }

  function playNewOrderAlert(){
    playAlertSound();
    if(navigator.vibrate) try{ navigator.vibrate([180,90,180]); }catch(e){}
  }
  function playAcceptedAlert(){
    ensureAudio();
    beep(880, 0, 0.14);
    beep(1320, 0.14, 0.16);
    if(navigator.vibrate) try{ navigator.vibrate(150); }catch(e){}
  }

  async function saveSoundPreset(presetKey){
    state.soundPref = {type:'preset', preset: presetKey};
    await setJSON('sound-pref', state.soundPref, false);
    render();
    ensureAudio();
    playAlertSound();
  }

  async function saveCustomSound(file){
    if(!file) return;
    if(file.size > 1.5*1024*1024){
      showToast('Arquivo muito grande — escolhe um som curto (até ~1,5MB)');
      return;
    }
    const reader = new FileReader();
    reader.onload = async ()=>{
      state.soundPref = {type:'custom', dataUri: reader.result, fileName: file.name};
      await setJSON('sound-pref', state.soundPref, false);
      render();
      ensureAudio();
      playAlertSound();
      showToast('Som personalizado salvo ✅');
    };
    reader.onerror = ()=> showToast('Não consegui ler esse arquivo');
    reader.readAsDataURL(file);
  }

  function soundPrefLabel(){
    const pref = getSoundPref();
    if(pref.type==='custom') return pref.fileName ? ('Meu som (' + pref.fileName + ')') : 'Meu som';
    return (SOUND_PRESETS[pref.preset] || SOUND_PRESETS.padrao).label;
  }

  let knownOrderStatuses = {};
  let knownAvailableIds = new Set();
  let notifyFirstLoad = true;
  function resetNotificationTracking(){
    knownOrderStatuses = {};
    knownAvailableIds = new Set();
    notifyFirstLoad = true;
  }

  // ---------- state ----------
  let state = {
    screen: 'loading', // loading, setup, welcome, login-business, register-business, complete-business, login-motoboy, register-motoboy, complete-motoboy, business-dash, motoboy-dash
    apiBase: '', // URL of your backend, e.g. https://despacho-api.up.railway.app
    apiOk: null, // null=checking, true=reachable, false=couldn't reach the server
    isOffline: (typeof navigator !== 'undefined' && 'onLine' in navigator) ? !navigator.onLine : false,
    authToken: null, // session token from login/register — sent as Authorization: Bearer <token>
    role: null,
    myId: null,
    profile: null,
    orders: [],
    transactions: [], // business only — the Pix/débito extrato
    availableOrders: [], // motoboy only — orders currently offered to them, straight from the server
    motoboyTab: 'disponiveis',
    businessTab: 'ativas',
    modal: null, // 'new-order'
    showTopup: false,
    topupPix: null, // {paymentId, qrCodeBase64, qrCode} once a Pix has been generated
    incomingAlert: null, // order object for the big banner shown to an online motoboy
    cancelModal: null, // {orderId, reason, note} while the cancel-reason sheet is open
    rateModal: null, // {orderId, stars, comment} while the rating sheet is open
    myRatingSummary: null, // {average, count} for whoever is logged in
    historyDateFilter: 'todas', // hoje | 7dias | 30dias | todas
    historyStatusFilter: 'todas', // todas | finalizadas | canceladas | andamento
    soundPref: null, // {type:'preset', preset:'padrao'} or {type:'custom', dataUri, fileName} — motoboy's own device only
    showSoundPicker: false,
    toast: null
  };

  let pollHandle = null;
  const root = document.getElementById('app');

  function setState(patch){
    state = Object.assign({}, state, patch);
    render();
  }
  function showToast(msg){
    setState({toast: msg});
    setTimeout(()=>{ if(state.toast===msg) setState({toast:null}); }, 2600);
  }

  // Surface any unexpected error on-screen instead of failing silently —
  // this is what would previously make a broken click look like "nothing happens".
  window.addEventListener('error', function(ev){
    console.error('Erro não tratado:', ev.error || ev.message);
    showToast('Erro: ' + (ev.message || 'algo deu errado') );
  });
  window.addEventListener('unhandledrejection', function(ev){
    console.error('Promise rejeitada:', ev.reason);
    showToast('Erro ao salvar. Tenta de novo.');
  });

  // ---------- init ----------
  async function init(){
    state.apiBase = (await getJSON('api-base-url', false)) || DEFAULT_API_BASE;
    state.apiOk = await apiSelfTest();
    state.soundPref = (await getJSON('sound-pref', false)) || {type:'preset', preset:'padrao'};

    const token = await getJSON('auth-token', false);
    if(token){
      state.authToken = token;
      const me = await apiGet('/api/me');
      if(me){
        state.role = me.type;
        state.myId = me.profile.id;
        state.profile = me.profile;
        state.screen = me.type==='business' ? 'business-dash' : 'motoboy-dash';
        resetNotificationTracking();
        await refreshOrders();
        await refreshMyRatingSummary();
        startPolling();
        render();
        return;
      }
      // token was rejected — clear it and fall through to a fresh welcome screen
      state.authToken = null;
      await setJSON('auth-token', null, false);
    }
    setState({screen: initialScreenFromLink()});
  }

  // Lets you send a link that skips the "quem está entrando" screen and
  // goes straight to login/cadastro de um papel específico — ex.:
  // /entregas.html?tipo=motoboy  ou  /entregas.html?tipo=comercio
  function initialScreenFromLink(){
    const tipo = new URLSearchParams(location.search).get('tipo');
    if(tipo === 'motoboy') return 'login-motoboy';
    if(tipo === 'comercio' || tipo === 'business') return 'login-business';
    return 'welcome';
  }

  async function saveApiBase(url){
    const clean = url.trim().replace(/\/+$/,''); // strip trailing slash
    if(!clean){ showToast('Digite um endereço válido'); return; }
    await setJSON('api-base-url', clean, false);
    state.apiBase = clean;
    render();
    state.apiOk = await apiSelfTest();
    if(state.apiOk){
      showToast('Servidor conectado ✅');
      setState({screen:'welcome'});
    } else {
      showToast('Não consegui conectar nesse endereço — confira e tente de novo');
      render();
    }
  }

  async function refreshOrders(){
    if(state.role === 'business'){
      const orders = (await apiGet('/api/orders')) || [];
      orders.sort((a,b)=> b.createdAt - a.createdAt);

      if(!notifyFirstLoad){
        orders.forEach(o=>{
          const prevStatus = knownOrderStatuses[o.id];
          if(prevStatus !== undefined && prevStatus !== o.status){
            if(o.status==='aceito') { playAcceptedAlert(); showToast('✅ ' + o.motoboyName + ' aceitou a corrida'); }
            if(o.status==='no_local_retirada') showToast('📦 ' + o.motoboyName + ' chegou na retirada');
            if(o.status==='em_entrega') showToast('🛵 ' + o.motoboyName + ' saiu para a entrega');
            if(o.status==='no_local_entrega') showToast('🏁 ' + o.motoboyName + ' chegou no destino');
            if(o.status==='entregue') showToast('📦 Entrega concluída por ' + o.motoboyName);
          }
        });
      }
      knownOrderStatuses = {};
      orders.forEach(o=>{ knownOrderStatuses[o.id] = o.status; });
      notifyFirstLoad = false;
      state.orders = orders;
      state.availableOrders = [];

    } else if(state.role === 'motoboy'){
      const isOnline = motoboyStatus() === 'online';
      const [mineRaw, availableRaw] = await Promise.all([
        apiGet('/api/orders'),
        isOnline ? apiGet('/api/orders/available') : Promise.resolve([])
      ]);
      const mine = (mineRaw || []).filter(o => o.status !== 'pendente');
      const available = (availableRaw || []).slice();
      mine.sort((a,b)=> b.createdAt - a.createdAt);
      available.sort((a,b)=> a.createdAt - b.createdAt);

      if(!notifyFirstLoad && isOnline){
        available.forEach(o=>{
          if(!knownAvailableIds.has(o.id)){
            playNewOrderAlert();
            showToast('🔔 Nova corrida disponível — ' + formatMoney(o.value));
            state.incomingAlert = o;
          }
        });
      }
      knownAvailableIds = new Set(available.map(o=>o.id));
      notifyFirstLoad = false;

      if(state.incomingAlert && !available.some(o=>o.id===state.incomingAlert.id)){
        state.incomingAlert = null;
      }

      state.orders = mine;
      state.availableOrders = available;
    } else {
      state.orders = [];
      state.availableOrders = [];
    }
  }

  function startPolling(){
    if(pollHandle) clearInterval(pollHandle);
    pollHandle = setInterval(async ()=>{
      // Don't disrupt any open form/sheet — re-rendering while the person
      // is typing would reset the field and make it look like it's blinking.
      if(state.modal || state.showTopup || state.cancelModal || state.showSoundPicker || state.rateModal) return;
      await refreshOrders();
      render();
    }, 3000);
  }

  const ACTIVE_STATUSES = ['aceito','no_local_retirada','em_entrega','no_local_entrega'];
  const OFFER_TIMEOUT_MS = 30 * 1000; // must match OFFER_TIMEOUT_MS on the server — used here only to draw the countdown
  const PICKUP_WINDOW_MS = 16 * 60 * 1000; // 16 minutes for each leg (to pickup, and to delivery)
  const ARRIVAL_RADIUS_METERS = 150; // must match ARRIVAL_RADIUS_METERS on the server

  function haversineMeters(lat1,lng1,lat2,lng2){
    const R = 6371000;
    const toRad = d => d*Math.PI/180;
    const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // ---------- live GPS tracking for the arrival lock ----------
  // While the motoboy has an active ride, we keep a live watch on their
  // position so the "Cheguei" button can unlock itself the moment they're
  // close enough — the server checks the same thing again when the button
  // is actually pressed, so this client-side view is just for UX/feedback.
  let geoWatchId = null;
  let geoWatchKey = null; // orderId + ':' + phase, so we know when to restart the watch
  let liveGeo = null;     // {lat, lng, acc} — most recent fix
  let geoState = 'idle';  // idle | locating | ok | denied | unsupported

  function ensureGeoWatch(orderId, phase){
    const key = orderId + ':' + phase;
    if(geoWatchKey === key && geoWatchId !== null) return; // already watching the right thing
    stopGeoWatch();
    geoWatchKey = key;
    if(!navigator.geolocation){ geoState = 'unsupported'; return; }
    geoState = 'locating';
    geoWatchId = navigator.geolocation.watchPosition(
      pos => {
        liveGeo = {lat:pos.coords.latitude, lng:pos.coords.longitude, acc:Math.round(pos.coords.accuracy)};
        geoState = 'ok';
      },
      err => {
        geoState = (err && err.code === 1) ? 'denied' : 'unsupported';
      },
      {enableHighAccuracy:true, maximumAge:4000, timeout:12000}
    );
  }
  function stopGeoWatch(){
    if(geoWatchId !== null && navigator.geolocation){
      try{ navigator.geolocation.clearWatch(geoWatchId); }catch(e){}
    }
    geoWatchId = null;
    geoWatchKey = null;
  }
  function retryGeoWatch(){
    liveGeo = null;
    geoState = 'idle';
    const key = geoWatchKey;
    stopGeoWatch();
    if(key){
      const [orderId, phase] = key.split(':');
      ensureGeoWatch(orderId, phase);
    }
    render();
  }

  async function acceptOrder(orderId){
    const alreadyActive = state.orders.some(o => o.motoboyId===state.myId && ACTIVE_STATUSES.includes(o.status));
    if(alreadyActive){
      showToast('Você já tem uma corrida em andamento — finalize-a primeiro');
      return;
    }
    if(state.incomingAlert && state.incomingAlert.id===orderId) state.incomingAlert = null;
    const result = await apiPost('/api/orders/'+orderId+'/accept', {motoboyId: state.myId});
    if(result.error){
      showToast(result.error);
      await refreshOrders(); render();
      return;
    }
    await refreshOrders();
    render();
    showToast('Corrida aceita — você tem 16 min até a retirada');
  }

  async function declineOrder(orderId){
    if(state.incomingAlert && state.incomingAlert.id===orderId) state.incomingAlert = null;
    const result = await apiPost('/api/orders/'+orderId+'/decline', {motoboyId: state.myId});
    if(result.error) showToast(result.error);
    await refreshOrders();
    render();
    if(!result.error) showToast('Corrida recusada');
  }

  // Backing out AFTER accepting, but before picking up the package. Unlike
  // cancelling, this keeps the ride alive — it just goes back into the
  // queue for the next motoboy, so the business doesn't need to do anything.
  async function giveUpOrder(orderId){
    if(!confirm('Devolver essa corrida? Ela vai direto pro próximo motoboy da fila — o comércio não vai precisar recriar nada.')) return;
    stopGeoWatch();
    const result = await apiPost('/api/orders/'+orderId+'/give-up', {});
    if(result.error){ showToast(result.error); return; }
    await refreshOrders();
    render();
    showToast('Corrida devolvida — foi para o próximo motoboy da fila');

  // ---------- render ----------
  function render(){
    root.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.style.display='flex';
    wrap.style.flexDirection='column';
    wrap.style.minHeight='100vh';

    if(state.screen==='loading'){
      wrap.innerHTML = `<div style="padding:40px;text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:12px;">carregando…</div>`;
      root.appendChild(wrap);
      return;
    }

    wrap.appendChild(renderTopbar());

    if(state.isOffline){
      const warn = document.createElement('div');
      warn.className = 'sync-warning';
      warn.innerHTML = `📵 Sem conexão com a internet. Assim que voltar, o app atualiza sozinho.`;
      wrap.appendChild(warn);
    } else if(state.apiOk === false){
      const warn = document.createElement('div');
      warn.className = 'sync-warning';
      warn.innerHTML = `⚠️ Não consegui conectar ao servidor (<code>${esc(state.apiBase)}</code>). Tentando de novo automaticamente… <span id="btn-change-server" style="text-decoration:underline;cursor:pointer;">Trocar endereço do servidor</span>.`;
      wrap.appendChild(warn);
    }

    const main = document.createElement('main');

    if(state.screen==='welcome') main.appendChild(renderWelcome());
    else if(state.screen==='setup') main.appendChild(renderSetup());
    else if(state.screen==='login-business') main.appendChild(renderLoginBusiness());
    else if(state.screen==='register-business') main.appendChild(renderRegisterBusiness());
    else if(state.screen==='complete-business') main.appendChild(renderCompleteBusiness());
    else if(state.screen==='login-motoboy') main.appendChild(renderLoginMotoboy());
    else if(state.screen==='register-motoboy') main.appendChild(renderRegisterMotoboy());
    else if(state.screen==='complete-motoboy') main.appendChild(renderCompleteMotoboy());
    else if(state.screen==='business-dash') main.appendChild(renderBusinessDash());
    else if(state.screen==='statement') main.appendChild(renderStatement());
    else if(state.screen==='invoice') main.appendChild(renderInvoice());
    else if(state.screen==='profile') main.appendChild(renderProfile());
    else if(state.screen==='history-business') main.appendChild(renderHistoryBusiness());
    else if(state.screen==='history-motoboy') main.appendChild(renderHistoryMotoboy());
    else if(state.screen==='motoboy-dash') main.appendChild(renderMotoboyDash());

    wrap.appendChild(main);

    if(state.screen==='business-dash'){
      const fab = document.createElement('div');
      fab.className='fab';
      fab.innerHTML = `<div class="fab-inner"><button class="btn-primary" id="btn-new-order">+ Solicitar entrega</button></div>`;
      wrap.appendChild(fab);
    }

    root.appendChild(wrap);

    if(state.screen==='motoboy-dash' && state.incomingAlert){
      const spacer = document.createElement('div');
      spacer.style.height = '54px';
      wrap.insertBefore(spacer, wrap.firstChild);
      root.appendChild(renderIncomingAlertBanner(state.incomingAlert));
    }

    if(state.modal==='new-order'){
      root.appendChild(renderNewOrderModal());
    }
    if(state.showTopup){
      root.appendChild(renderTopupModal());
    }
    if(state.cancelModal){
      root.appendChild(renderCancelModal());
    }
    if(state.showSoundPicker){
      root.appendChild(renderSoundPickerModal());
    }
    if(state.rateModal){
      root.appendChild(renderRateModal());
    }
    if(state.toast){
      const t = document.createElement('div');
      t.className='toast';
      t.textContent = state.toast;
      root.appendChild(t);
    }

    attachHandlers();
  }

  async function saveProfile(data){
    const endpoint = state.role==='business' ? '/api/businesses/'+state.myId : '/api/motoboys/'+state.myId;
    const result = await apiPatch(endpoint, data);
    if(result.error){ showToast(result.error); return; }
    state.profile = result;
    render();
    showToast('Dados atualizados ✅');
  }

  async function changePassword(data){
    const endpoint = state.role==='business'
      ? '/api/businesses/'+state.myId+'/change-password'
      : '/api/motoboys/'+state.myId+'/change-password';
    const result = await apiPost(endpoint, data);
    if(result.error){ showToast(result.error); return; }
    showToast('Senha alterada ✅');
    const form = root.querySelector('#form-change-password');
    if(form) form.reset();

        <button class="tab-btn ${state.businessTab==='ativas'?'active':''}" data-btab="ativas">Em andamento</button>
        <button class="tab-btn ${state.businessTab==='finalizadas'?'active':''}" data-btab="finalizadas">Finalizadas</button>
        <button class="tab-btn ${state.businessTab==='canceladas'?'active':''}" data-btab="canceladas">Canceladas</button>
      </div>
      <div id="orders-list"></div>
    `;
    const list = d.querySelector('#orders-list');
    const tab = state.businessTab;
    const shown = tab==='ativas' ? ativas : tab==='finalizadas' ? finalizadas : canceladas;
    if(shown.length===0){
      const emptyByTab = {
        ativas: ['📦','Nenhuma corrida em andamento.<br>Toque em "Solicitar entrega" para chamar um motoboy.'],
        finalizadas: ['✅','Nenhuma corrida finalizada ainda.'],
        canceladas: ['🗑️','Nenhuma corrida cancelada.']
      };
      const [emoji, text] = emptyByTab[tab];
      list.innerHTML = `<div class="empty-state"><span class="empty-state-emoji">${emoji}</span><div class="empty-state-text">${text}</div></div>`;
    } else {
      shown.forEach(o => list.appendChild(renderTicket(o, 'business')));
    }
    return d;
  }

  let lastKnownActiveOrderId = null;
  function renderMotoboyDash(){
    const d = document.createElement('div');
    const curStatus = motoboyStatus();

    if(state.profile.approved === false){
      d.innerHTML = `
        <p class="eyebrow">Painel do motoboy</p>
        <h1 class="page-title">${esc(state.profile.name)}</h1>
        <div class="active-ride is-parked" style="margin-top:16px;">
          <div class="active-ride-head"><span class="active-ride-label">⏳ Cadastro em análise</span></div>
          <p class="page-sub" style="margin-top:8px;">Seu cadastro foi recebido e está aguardando aprovação. Assim que for aprovado, você já poderá ficar on-line e começar a receber corridas.</p>
        </div>
      `;
      return d;
    }

    const online = curStatus === 'online';
    const disponiveis = state.availableOrders || [];
    const allMine = state.orders || []; // refreshOrders already keeps only this motoboy's own (non-pendente) orders
    const ativa = allMine.filter(o=>ACTIVE_STATUSES.includes(o.status));
    const finalizadas = allMine.filter(o=>o.status==='entregue');
    const canceladas = allMine.filter(o=>o.status==='cancelado');
    const ganho = finalizadas.reduce((s,o)=>s+o.value,0);
    // Only one active ride at a time.
    const activeOrder = ativa[0] || null;
    if(!activeOrder) stopGeoWatch();

    // If the ride that WAS active a moment ago just vanished, and we're now
    // in a forced pause, it's because the pickup window expired — the
    // background job on the server took it back. Say so explicitly instead
    // of just letting it silently disappear (which would look like a bug).
    if(!activeOrder && lastKnownActiveOrderId && state.profile && state.profile.forcedPauseUntil && state.profile.forcedPauseUntil > Date.now()){
      showToast('⏰ Você perdeu essa corrida por não chegar a tempo na retirada — pausa automática de 10 min');
    }
    lastKnownActiveOrderId = activeOrder ? activeOrder.id : null;

    d.innerHTML = `
      <p class="eyebrow">Painel do motoboy</p>
      <h1 class="page-title">${esc(state.profile.name)}</h1>
      <p class="page-sub" style="font-family:var(--font-mono);font-size:12px;">🏍️ ${esc(state.profile.vehicle)}</p>
      <div style="margin-bottom:16px;">${ratingBadgeHtml()}</div>
      <div class="status-toggle-row">
        <button class="status-btn is-online ${curStatus==='online'?'active':''}" data-set-status="online">🟢 On-line</button>
        <button class="status-btn is-pausado ${curStatus==='pausado'?'active':''}" data-set-status="pausado">🟡 Pausado</button>
        <button class="status-btn is-offline ${curStatus==='offline'?'active':''}" data-set-status="offline">⚪ Off-line</button>
      </div>
      ${curStatus==='pausado' && state.profile.forcedPauseUntil && state.profile.forcedPauseUntil > Date.now()
        ? `<div class="field-hint" style="margin-bottom:16px;color:#FF6A6A;">⏸️ Pausa automática: você perdeu a última corrida por não chegar a tempo na retirada. Você volta a poder ficar on-line <span id="forced-pause-countdown" data-until="${state.profile.forcedPauseUntil}">em instantes</span>.</div>`
        : curStatus==='pausado' ? `<div class="field-hint" style="margin-bottom:16px;">Pausado: você não recebe corridas novas, mas continua podendo terminar uma corrida já em andamento.</div>` : ''}
      ${activeOrder ? '' : `<button class="btn-secondary" id="btn-open-sound-picker" style="margin-bottom:20px;">🔊 Som de aviso: ${esc(soundPrefLabel())}</button>`}
      ${activeOrder ? renderActiveRideBanner(activeOrder) : ''}
      <div class="stat-strip">
        <div class="stat-box"><div class="stat-num">${disponiveis.length}</div><div class="stat-label">Disponíveis</div></div>
        <div class="stat-box"><div class="stat-num">${ativa.length}</div><div class="stat-label">Em andamento</div></div>
        <div class="stat-box"><div class="stat-num">${formatMoney(ganho)}</div><div class="stat-label">Ganho (total)</div></div>
      </div>
      <div class="quick-access-row">
        <button class="quick-access-btn" id="btn-open-history"><span class="qa-icon">📜</span>Meu histórico</button>
        <button class="quick-access-btn" id="btn-open-earnings"><span class="qa-icon">💰</span>Meus ganhos</button>
      </div>
      <div class="tab-row">
        <button class="tab-btn ${state.motoboyTab==='disponiveis'?'active':''}" data-tab="disponiveis">Disponíveis</button>
        <button class="tab-btn ${state.motoboyTab==='ativa'?'active':''}" data-tab="ativa">Em andamento</button>
        <button class="tab-btn ${state.motoboyTab==='finalizadas'?'active':''}" data-tab="finalizadas">Finalizadas</button>
        <button class="tab-btn ${state.motoboyTab==='canceladas'?'active':''}" data-tab="canceladas">Canceladas</button>
      </div>
      <div id="orders-list"></div>
    `;
    const list = d.querySelector('#orders-list');
    const tab = state.motoboyTab;
    if(tab==='disponiveis'){
      if(activeOrder){
        list.innerHTML = `<div class="empty-state"><span class="empty-state-emoji">🔒</span><div class="empty-state-text">Você já está em uma corrida.<br>Finalize a entrega atual para ver novas corridas.</div></div>`;
      } else if(!online){
        list.innerHTML = `<div class="empty-state"><span class="empty-state-emoji">${curStatus==='pausado'?'🟡':'⚪'}</span><div class="empty-state-text">${curStatus==='pausado'?'Você está pausado.':'Você está off-line.'}<br>Fique on-line para ver e receber corridas.</div></div>`;
      } else if(disponiveis.length===0){
        list.innerHTML = `<div class="empty-state"><span class="empty-state-emoji">🏍️</span><div class="empty-state-text">Nenhuma corrida disponível agora.<br>Assim que um comércio pedir, ela aparece aqui.</div></div>`;
      } else {
        disponiveis.forEach(o => list.appendChild(renderTicket(o, 'motoboy-available')));
      }
    } else if(tab==='ativa'){
      if(!activeOrder){
        list.innerHTML = `<div class="empty-state"><span class="empty-state-emoji">📭</span><div class="empty-state-text">Nenhuma corrida em andamento agora.</div></div>`;
      } else {
        list.appendChild(renderTicket(activeOrder, 'motoboy-mine'));
      }
    } else if(tab==='finalizadas'){
      if(finalizadas.length===0){
        list.innerHTML = `<div class="empty-state"><span class="empty-state-emoji">✅</span><div class="empty-state-text">Nenhuma corrida finalizada ainda.</div></div>`;
      } else {
        finalizadas.forEach(o => list.appendChild(renderTicket(o, 'motoboy-mine')));
      }
    } else {
      if(canceladas.length===0){
        list.innerHTML = `<div class="empty-state"><span class="empty-state-emoji">🗑️</span><div class="empty-state-text">Nenhuma corrida cancelada.</div></div>`;
      } else {
        canceladas.forEach(o => list.appendChild(renderTicket(o, 'motoboy-mine')));
      }
    }
    return d;
  }

  // Renders the GPS lock block: a live distance readout plus the arrival
  // button, which starts disabled and only enables once close enough.
  // If we don't have coordinates for this address (geocoding failed), we
  // skip the lock entirely and just show a plain enabled button.
  function renderGpsLock(o, coordsField, phase, buttonAttr, buttonLabel){
    ensureGeoWatch(o.id, phase);
    const target = o[coordsField];
    if(!target){
      return `
        <div class="gps-note">📡 Não conseguimos localizar esse endereço no mapa — confirmação sem checagem de GPS.</div>
        <button class="btn-stage" ${buttonAttr}="${o.id}">${buttonLabel}</button>
      `;
    }
    return `
      <div class="gps-lock" data-lat="${target.lat}" data-lng="${target.lng}" data-phase="${phase}">
        <div class="gps-distance" id="gps-distance">📡 Obtendo sua localização…</div>
      </div>
      <button class="btn-stage" ${buttonAttr}="${o.id}" disabled>${buttonLabel}</button>
    `;
  }

  // Renders an address line with a "copiar" button next to it, so the
  // motoboy can paste it straight into whatever GPS app they actually use
  // (Waze, Google Maps, etc) instead of retyping it by hand.
  function renderAddressLine(address){
    const attr = esc(address).replace(/"/g, '&quot;');
    return `<div class="active-ride-addr" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <span>📍 ${esc(address)}</span>
      <button type="button" class="btn-copy-addr" data-copy-address="${attr}" title="Copiar endereço">📋 Copiar</button>
    </div>`;
  }

  function renderActiveRideBanner(o){
    const cancelLink = `<div style="text-align:center;margin-top:10px;"><span class="link-muted" data-open-cancel="${o.id}">Cancelar corrida</span></div>`;
    const giveUpLink = `<div style="text-align:center;margin-top:10px;"><span class="link-muted" data-give-up="${o.id}">Devolver corrida (não posso mais fazer)</span></div>`;
    if(o.status === 'aceito'){
      return `
        <div class="active-ride" id="active-ride-banner">
          <div class="active-ride-head">
            <span class="active-ride-label">🏍️ Indo até a retirada</span>
            <span class="countdown-value" id="countdown-timer" data-start-at="${o.acceptedAt}">16:00</span>
          </div>
          <div class="active-ride-sub">até a retirada</div>
          ${renderAddressLine(o.pickupAddress)}
          ${renderGpsLock(o, 'pickupCoords', 'pickup', 'data-arrive-pickup', '📍 Cheguei na retirada')}
          ${giveUpLink}
        </div>
      `;
    }
    if(o.status === 'no_local_retirada'){
      stopGeoWatch();
      return `
        <div class="active-ride is-parked" id="active-ride-banner">
          <div class="active-ride-head">
            <span class="active-ride-label">📦 Na retirada</span>
          </div>
          ${renderAddressLine(o.pickupAddress)}
          <div class="active-ride-hint">Colete o pedido e toque em sair quando estiver pronto.</div>
          <button class="btn-stage" data-depart="${o.id}">🚀 Saí para a entrega</button>
          ${cancelLink}
        </div>
      `;
    }
    if(o.status === 'em_entrega'){
      return `
        <div class="active-ride" id="active-ride-banner">
          <div class="active-ride-head">
            <span class="active-ride-label">🛵 Indo até a entrega</span>
            <span class="countdown-value" id="countdown-timer" data-start-at="${o.departedAt}">16:00</span>
          </div>
          <div class="active-ride-sub">até a entrega</div>
          ${renderAddressLine(o.deliveryAddress)}
          ${renderGpsLock(o, 'deliveryCoords', 'delivery', 'data-arrive-delivery', '📍 Cheguei na entrega')}
          ${cancelLink}
        </div>
      `;
    }
    // no_local_entrega — no cancel option here, delivery is effectively done
    stopGeoWatch();
    return `
      <div class="active-ride is-parked" id="active-ride-banner">
        <div class="active-ride-head">
          <span class="active-ride-label">🏁 No destino</span>
        </div>
        ${renderAddressLine(o.deliveryAddress)}
        <div class="active-ride-hint">Entregue o pedido e confirme abaixo.</div>
        <button class="btn-deliver" style="width:100%;margin-top:10px;" data-deliver="${o.id}">✅ Confirmar entrega</button>
      </div>
    `;
  }

  function statusBadge(status){
    if(status==='pendente') return `<span class="ticket-badge badge-pendente">Aguardando motoboy</span>`;
    if(status==='aceito') return `<span class="ticket-badge badge-aceito">A caminho da retirada</span>`;
    if(status==='no_local_retirada') return `<span class="ticket-badge badge-aceito">Na retirada</span>`;
    if(status==='em_entrega') return `<span class="ticket-badge badge-aceito">A caminho da entrega</span>`;
    if(status==='no_local_entrega') return `<span class="ticket-badge badge-aceito">No destino</span>`;
    if(status==='cancelado') return `<span class="ticket-badge badge-cancelado">Cancelada</span>`;
    return `<span class="ticket-badge badge-entregue">Entregue</span>`;
  }

  function renderTicket(o, mode){
    const el = document.createElement('div');
    el.className='ticket';

    let footExtra = '';
    if(mode==='business'){
      if(ACTIVE_STATUSES.includes(o.status) || o.status==='entregue'){
        footExtra = `<a class="call-link" href="tel:${esc(o.motoboyPhone)}">📞 ${esc(o.motoboyName)}</a>`;
      }
    }

    let actions = '';
    if(mode==='motoboy-available'){
      const hasQueue = o.offerQueue && o.offerQueue.length>0 && o.offerIndex < o.offerQueue.length;
      const offerNote = hasQueue
        ? `<div class="offer-note">🎯 Oferecida a você agora · expira em <span class="offer-countdown" data-offered-at="${o.offeredAt}">30s</span></div>`
        : '';
      actions = `
        ${offerNote}
        <div class="ticket-actions">
          <button class="btn-cancel" data-decline="${o.id}">Recusar</button>
          <button class="btn-accept" data-accept="${o.id}">Aceitar corrida</button>
        </div>`;
    } else if(mode==='motoboy-mine' && ACTIVE_STATUSES.includes(o.status)){
      actions = `<div class="ticket-actions">
        <a class="call-link" style="flex:1;text-align:center;" href="tel:${esc(o.businessPhone)}">📞 ${esc(o.businessName)}</a>
        <button class="btn-cancel" data-open-cancel="${o.id}">Cancelar</button>
      </div>`;
    } else if(mode==='business' && (o.status==='pendente' || ACTIVE_STATUSES.includes(o.status))){
      actions = `<div class="ticket-actions">
        <button class="btn-cancel" data-open-cancel="${o.id}">Cancelar corrida</button>
      </div>`;
    } else if(mode==='business' && o.status==='entregue'){
      actions = o.ratedByBusiness
        ? `<div class="rated-note">⭐ Você já avaliou essa entrega</div>`
        : `<div class="ticket-actions"><button class="btn-accept" data-open-rate="${o.id}">⭐ Avaliar motoboy</button></div>`;
    } else if(mode==='motoboy-mine' && o.status==='entregue'){
      actions = o.ratedByMotoboy
        ? `<div class="rated-note">⭐ Você já avaliou essa entrega</div>`
        : `<div class="ticket-actions"><button class="btn-accept" data-open-rate="${o.id}">⭐ Avaliar comércio</button></div>`;
    }

    el.innerHTML = `
      <div class="ticket-top">
        <span class="ticket-id">#${o.id.slice(-6).toUpperCase()} · ${timeAgo(o.createdAt)}</span>
        ${statusBadge(o.status)}
      </div>
      <div class="ticket-body">
        ${mode!=='business' ? `<div class="ticket-meta" style="margin-bottom:10px;">🏬 ${esc(o.businessName)}</div>` : ''}
        <div class="route">
          <div class="route-line">
            <div class="dot dot-origin"></div>
            <div class="route-connector"></div>
            <div class="dot dot-dest"></div>
          </div>
          <div class="route-points">
            <div>
              <div class="route-point-label">Retirada</div>
              <div class="route-point-addr">${esc(o.pickupAddress)}</div>
            </div>
            <div>
              <div class="route-point-label">Entrega</div>
              <div class="route-point-addr">${esc(o.deliveryAddress)}</div>
            </div>
          </div>
        </div>
        ${o.note ? `<div class="ticket-meta" style="margin-top:12px;">✎ ${esc(o.note)}</div>` : ''}
        ${o.status==='cancelado' && o.cancelReason ? `<div class="ticket-meta" style="margin-top:12px;color:var(--muted);">🚫 Cancelada por ${o.cancelledBy==='business'?'comércio':'motoboy'} — ${esc(o.cancelReason)}${o.cancelNote?': '+esc(o.cancelNote):''}</div>` : ''}
      </div>
      <div class="ticket-divider"></div>
      <div class="ticket-foot">
        <span class="ticket-value">${formatMoney(o.value)}</span>
        ${footExtra}
      </div>
      ${actions}
    `;
    return el;
  }

  function renderIncomingAlertBanner(o){
